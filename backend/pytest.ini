[pytest]
pythonpath = .
# The suite lives in tests/. runs/ holds what the scenario runner saves (including the agent's own copies of
# test files, one set per run), and collecting those fails with "import file mismatch".
testpaths = tests
norecursedirs = runs .git node_modules .venv
markers =
    attacks: containment suite; runs every Attack Lab attack against real Docker sandboxes
